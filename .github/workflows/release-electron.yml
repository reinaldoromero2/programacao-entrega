name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build and publish installer
        run: pnpm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure installer and update metadata are attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "dist-electron/ProgramacaoEntrega-Setup-$version.exe",
            "dist-electron/ProgramacaoEntrega-Setup-$version.exe.blockmap",
            "dist-electron/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Required release asset was not generated: $asset"
            }
          }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to attach all required assets to release $env:GITHUB_REF_NAME"
          }
